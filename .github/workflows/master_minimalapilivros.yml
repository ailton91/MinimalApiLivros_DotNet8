# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - MinimalApiLivros

on:
  push:
    branches:
      - Master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore MinimalApiLivros_DotNet8.slnx

      - name: Build solution
        run: dotnet build MinimalApiLivros_DotNet8.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test MinimalApiLivros.TesteXUnit/MinimalApiLivros.TesteXUnit.csproj --configuration Release --no-build

      - name: Publish API project
        run: dotnet publish MinimalApiLivros/MinimalApiLivros.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp --no-build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Required for requesting the JWT
      contents: read # Required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E9C458D8053A4692A92B8F73DA84E2E3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_722E408EC0374B34BA53FD588A1DFE5A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_937E56FC3E2E43D180204AA28390702C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'MinimalApiLivros'
          slot-name: 'Production'
          package: .